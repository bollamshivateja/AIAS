<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Responsive 3-Column Image Gallery</title>
    <style>
        :root { --gap:16px; --max-width:1100px; }
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; padding:24px; display:flex; justify-content:center; background:#fafafa; }
        .wrap { width:100%; max-width:var(--max-width); }
        h1 { margin:0 0 18px; font-size:20px; color:#222; text-align:center; }

        /* 3-column responsive grid */
        .gallery {
            display:grid;
            gap:var(--gap);
            grid-template-columns: repeat(3, 1fr);
        }
        @media (max-width:900px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width:600px) { .gallery { grid-template-columns: 1fr; } }

        .item {
            position:relative;
            overflow:hidden;
            background:#eee;
            border-radius:8px;
            box-shadow:0 1px 4px rgba(0,0,0,.06);
        }
        .item img {
            width:100%;
            height:220px;
            object-fit:cover;
            display:block;
            transition: transform .25s ease;
            cursor:zoom-in;
        }
        .item:hover img { transform: scale(1.04); }

        /* Modal / lightbox */
        .lightbox {
            position:fixed; inset:0; display:none; align-items:center; justify-content:center;
            background:rgba(0,0,0,.65); z-index:1000; padding:24px;
        }
        .lightbox.open { display:flex; }
        .lightbox-content {
            position:relative; max-width:95%; max-height:95%;
            display:flex; align-items:center; justify-content:center;
        }
        .lightbox img {
            max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.5);
        }
        .close-btn, .nav {
            position:absolute; color:#fff; background:rgba(0,0,0,.35); border:0; padding:8px 10px;
            border-radius:6px; cursor:pointer; font-size:16px;
        }
        .close-btn { top:12px; right:12px; }
        .nav { top:50%; transform:translateY(-50%); }
        .nav.prev { left:12px; }
        .nav.next { right:12px; }
        .caption { color:#fff; margin-top:8px; text-align:center; font-size:14px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Responsive 3-Column Image Gallery</h1>
        <div class="gallery" id="gallery">
            <!-- Replace URLs with your own images if desired -->
            <div class="item"><img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?q=80&w=1200&auto=format&fit=crop" alt="Mountain" data-index="0"></div>
            <div class="item"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1200&auto=format&fit=crop" alt="River" data-index="1"></div>
            <div class="item"><img src="https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d?q=80&w=1200&auto=format&fit=crop" alt="Forest" data-index="2"></div>
            <div class="item"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1200&auto=format&fit=crop" alt="City" data-index="3"></div>
            <div class="item"><img src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?q=80&w=1200&auto=format&fit=crop" alt="Desert" data-index="4"></div>
            <div class="item"><img src="https://images.unsplash.com/photo-1482192505345-5655af888cc4?q=80&w=1200&auto=format&fit=crop" alt="Sea" data-index="5"></div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <div class="lightbox-content" role="dialog" aria-modal="true">
            <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
            <button class="nav prev" id="prevBtn" aria-label="Previous">&#10094;</button>
            <img id="lightboxImg" src="" alt="">
            <button class="nav next" id="nextBtn" aria-label="Next">&#10095;</button>
        </div>
        <div class="caption" id="caption"></div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const caption = document.getElementById('caption');
        const closeBtn = document.getElementById('closeBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        const imgs = Array.from(gallery.querySelectorAll('img'));
        let current = 0;

        function open(index) {
            current = index;
            const img = imgs[current];
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt || '';
            caption.textContent = img.alt || '';
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden','false');
            document.body.style.overflow = 'hidden';
        }
        function close() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden','true');
            lightboxImg.src = '';
            document.body.style.overflow = '';
        }
        function showNext(delta) {
            current = (current + delta + imgs.length) % imgs.length;
            open(current);
        }

        imgs.forEach((img, i) => img.addEventListener('click', () => open(i)));
        closeBtn.addEventListener('click', close);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(-1); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showNext(1); });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) close();
        });

        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('open')) {
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowRight') showNext(1);
                if (e.key === 'ArrowLeft') showNext(-1);
            }
        });
    </script>
</body>
</html>
